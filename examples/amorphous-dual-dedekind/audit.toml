version = 1

[project]
name = "Amorphous sets and dual Dedekind finiteness"
source = "source/Amorphous sets and dual Dedekind finiteness.pdf"
source_kind = "pdf"
mode = "custom"

[runner]
kind = "manual"
executable = "codex"
model = ""
reasoning_effort = "high"
timeout_seconds = 1800
parallel = true

[gate]
policy = "all"
min_passes = 0
block_on_fail = true
block_on_uncertain = true

[[reviewers]]
id = "logic"
name = "Statements and logic"
lens = "Check the exact definitions and theorem statements, object types, quantifier scope, dependencies, and every nontrivial deduction."
required = true

[[reviewers]]
id = "choice-model"
name = "Choice and ambient models"
lens = "Track ZF versus ZFA, every use of Choice or a choice-like selection, the ambient universe of each object, absoluteness, and the assumptions of transfer results."
required = true

[[reviewers]]
id = "permutation"
name = "Permutation-model machinery"
lens = "Audit the permutation groups, normal filters, supports, symmetric objects, projective types, and any passage from an atoms model to a pure ZF model."
required = true

[[reviewers]]
id = "adversarial"
name = "Adversarial counterexample search"
lens = "Try to falsify each claim, test degenerate and boundary cases, and identify hidden well-ordering, uniformization, or unsupported existence assumptions."
required = true

